name: Macrobenchmark

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Macrobenchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :baselineprofile:connectedCheck --info || (adb logcat -d > logcat.txt && exit 1)

      - name: Upload Test Results and Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            logcat.txt
            baselineprofile/build/outputs/androidTest-results/

      - name: Assert Cold Start Time
        run: |
          python3 .github/scripts/check_benchmark.py
