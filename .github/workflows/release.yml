name: Build and Release Optimized APK

on:
  push:
    tags:
      - 'v*' # Automatically triggers when you push a tag like "v1.0"
  workflow_dispatch: # Allows you to manually click a "Run workflow" button on GitHub

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the GitHub Release
      
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Optimized APKs (Playstore Variant)
      run: ./gradlew assemblePlaystore
      
    - name: Sign APKs
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/playstore
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Rename and Stage APKs
      run: |
        mkdir -p release-apks
        # Fallback to "latest" if triggered manually without a tag
        TAG_NAME=${GITHUB_REF_NAME:-"latest"}
        
        for apk in app/build/outputs/apk/playstore/*-signed.apk; do
          filename=$(basename "$apk")
          
          # Map Android ABIs to the desired naming format
          if [[ "$filename" == *"arm64-v8a"* ]]; then
            NEW_NAME="Zerogram-${TAG_NAME}-aarch64_v8.apk"
          elif [[ "$filename" == *"armeabi-v7a"* ]]; then
            NEW_NAME="Zerogram-${TAG_NAME}-arm_v7a.apk"
          elif [[ "$filename" == *"x86_64"* ]]; then
            NEW_NAME="Zerogram-${TAG_NAME}-x86_64.apk"
          elif [[ "$filename" == *"x86"* ]]; then
            NEW_NAME="Zerogram-${TAG_NAME}-x86.apk"
          elif [[ "$filename" == *"universal"* ]]; then
            NEW_NAME="Zerogram-${TAG_NAME}-universal.apk"
          else
            NEW_NAME="Zerogram-${TAG_NAME}-unknown.apk"
          fi
          
          echo "Renaming $filename to $NEW_NAME"
          mv "$apk" "release-apks/$NEW_NAME"
        done
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-apks/*.apk
        generate_release_notes: true
